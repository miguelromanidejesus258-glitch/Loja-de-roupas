<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="shortcut icon" href="favicon.ico">
    <title>Detalhes | RM Store</title>
    <link rel="stylesheet" href="loja.css">
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script src="loja.js"></script>
</head>
<body class="descricao">
    <header>
        <h1><a href="loja.html">RMX Store</a></h1>
        <div class="options">
            <nav>
                <ul>
                    <li><a href="#Camisas">Camisas</a></li>
                    <li><a href="#short">Shorts</a></li>
                    <li><a href="#calca">Calças</a></li>
                    <li><a href="#Blusa">Blusas</a></li>
                    <li><a href="#conjunto">Conjuntos</a></li>
                    <li><a href="#promocao">Promoções</a></li>   
                </ul>
            </nav>
        </div>
        <div class="buttons-interact-header">

            <div class="search">
                <input type="search" id="searchDigitado" placeholder="Digite algum Produto.">
                <button class="button-search">
                    <ion-icon name="search-outline"></ion-icon>
                </button>
            </div>
            <div class="interact-header-cart-heart">
                <button class="cart">
                    <ion-icon name="cart-outline"></ion-icon>
                </button>
                <button class="heart">
                    <ion-icon name="heart-outline"></ion-icon>
                </button>
            </div>
            <button class="config-header">
                <ion-icon name="cog-outline"></ion-icon>
            </button>
        </div>
        
    </header>
    <main>
        <section class="details">
            <div class="card-details-img">
                <img id="imagem-principal" src="../assets/masculino/conjuntos/dry fit/blue/download.jpg" alt="">
                <button><img id="mini-1" src="" alt=""></button>
                <button><img id="mini-2" src="" alt=""></button>
             </div>
            <div class="interact-details">
                <h5>MAIS VENDIDO</h5>
                <h2 id="nome-produto">Camisa Dry fit Academy Nike Masculina</h2>
            <div class="buttons-details">
                <button>Compre agora</button>
                <button id="btn-add-carrinho-desc">Adicionar ao carrinho<ion-icon name="cart-outline"></ion-icon></button>
            </div>
            <div class="price-details">
                <h5>159,99R$</h5>
                <h2 id="preco-produto">119,99R$</h2>
            </div>
            <!-- resto igual -->
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-informations">
            <p>desenvolvido com <ion-icon name="heart-outline"></ion-icon> Por Miguel Romani</p>
            <p>Todos os direitos reservados</p>
            <p>₢ 2026</p>
        </div>
        <div class="footer-social">
            <p>Tem alguma duvida?<br>Fale conosco!</p>
            <p>Nossos meios de comunicação:</p>
            <div class="footer-redes-sociais">
                <a href="http://instagram.com/rm_store_011/" target="_blank">
                    <button id="instagram-footer">
                        <ion-icon name="logo-instagram"></ion-icon>   
                    </button>
                </a>
                <!--http://wa.me/5511951619314 - whatsapp-->
                <a href="http://wa.me/5511951619314" target="_blank" rel="noopener noreferrer">
                    <button id="whatsapp-footer">
                        <ion-icon name="logo-whatsapp"></ion-icon>
                    </button>
                </a>
                <button id="tiktok-footer">
                    <ion-icon name="logo-tiktok"></ion-icon>
                </button>
            </div>
        </div>
    </footer>
</body>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const dados = sessionStorage.getItem('productDetails');
  if(!dados) return;

  const p = JSON.parse(dados);

  // preenche com o que veio do card clicado
  document.getElementById('imagem-principal').src = p.image;
  document.getElementById('mini-1').src = p.image;
  document.getElementById('mini-2').src = p.image;
  document.getElementById('nome-produto').textContent = p.name;
  document.getElementById('preco-produto').textContent = p.price;

  // faz o botão de adicionar ao carrinho funcionar aqui também
  document.getElementById('btn-add-carrinho-desc').addEventListener('click', () => {
    // reaproveita sua função de toast
    if(typeof showCartAdded === 'function') {
      showCartAdded(p.name);
    } else {
      alert(p.name + ' adicionado!');
    }
  });
});
</script>z
</html>
