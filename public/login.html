<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/logo/favicon-16x16.png">
    <title>RMX Store | Login</title>
    <link rel="stylesheet" href="../src/css/login.css">
</head>
<body>
    <div class="login-container">
        <!-- Placeholder para a logo RMX -->
        <div class="logo-placeholder">
            <img src="../assets/logo/android-chrome-512x512.png" alt="Foto da logo da rmx store">
        </div>

        <div class="input-group" id="grupo-nome" hidden>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome">
        </div>
        <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
        </div>
        <div class="input-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="********">
        </div>
        <p id="login-msg"></p>
        <button class="login-button" id="btn-login" type="button">Entrar</button>
        <div class="signup-link">
            Não tem conta? <a href="#" id="link-cadastro">Cadastre-se</a>
        </div>
    </div>

    <script src="../src/js/login.js"></script>
</body>
</html>
